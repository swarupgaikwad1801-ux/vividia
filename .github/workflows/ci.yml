# Runs on every pull request, with no secrets and no network to Token Factory.
#
# NEBIUS_API_KEY is deliberately absent, so any test that tried to reach a real
# model would fail loudly on a missing key rather than quietly spend credit.
# ENGINE_MODE is pinned to "mock" for the same reason: the live-model tests in
# tests/test_safety.py skip themselves unless it is "live".
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend tests (offline)
    runs-on: ubuntu-latest
    env:
      ENGINE_MODE: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: pytest
        working-directory: backend
        run: python -m pytest -q

      # Catches the change that makes the app serve requests one after another:
      # against the mock engine, 50 concurrent requests take about 1.5 s and 50
      # serial ones take 75 s. Mock only, so it spends nothing.
      - name: Load test (50 parallel, mocked engine)
        working-directory: backend
        run: python ../eval/load_test.py --requests 50

      - name: Eval dry run
        run: |
          if [ -f eval/run_eval.py ]; then
            python eval/run_eval.py --dry-run
          else
            echo "::notice::eval/run_eval.py does not exist yet (Neel owns it, see issue #3)."
            echo "This step starts running on its own as soon as that file lands."
          fi

  # The screens and their lib/ modules. Plain node:test for lib/, then a full
  # typecheck and production build, so a change that breaks the app fails here
  # rather than in front of a judge. No secrets and no network to the backend.
  #
  # Skips itself until frontend/package-lock.json is on main (Vernika's app
  # setup), so it can never fail for want of a package.json.
  frontend:
    name: frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Is the app set up yet?
        id: setup
        working-directory: .
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::frontend/package-lock.json is not on this branch yet, so the frontend job skips."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (exact versions from the lock file)
        if: steps.setup.outputs.ready == 'true'
        run: npm ci

      - name: lib/ tests
        if: steps.setup.outputs.ready == 'true'
        run: npm test

      - name: Typecheck and production build
        if: steps.setup.outputs.ready == 'true'
        run: npm run build
