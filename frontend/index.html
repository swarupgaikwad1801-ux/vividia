<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      No `maximum-scale` and no `user-scalable=no`: a child must always be able
      to pinch-zoom (CLAUDE.md, Tier A accessibility). Locking zoom is the most
      common way a mobile app breaks for a low-vision user.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2e6e68" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14191a" media="(prefers-color-scheme: dark)" />
    <!--
      Nothing about this app should be guessable from a browser tab or a
      history entry read over a child's shoulder. No description, no keywords,
      and no indexing. The neutral display name is still to be agreed by the
      team (CLAUDE.md: shared devices need a neutral app name and icon).
    -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Vividia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
